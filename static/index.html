<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дубляж видео · английский → русский</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --line: #262b36; --text: #e8eaf0;
    --muted: #8b93a7; --accent: #4f8cff; --ok: #3ecf8e; --err: #ff5d5d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* .btn задаёт display и иначе перебивает attribute hidden */
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 48px 16px;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  .drop {
    border: 2px dashed var(--line); border-radius: 14px; padding: 56px 24px;
    text-align: center; cursor: pointer; background: var(--card);
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: #1a1f2b; }
  .drop p { margin: 0; color: var(--muted); font-size: 17px; }
  .drop .link { color: var(--accent); text-decoration: underline; }

  section { margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; }
  ol#steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  ol#steps li {
    counter-increment: step; padding: 9px 0 9px 40px; position: relative;
    color: var(--muted); border-bottom: 1px solid var(--line);
  }
  ol#steps li:last-child { border-bottom: none; }
  ol#steps li::before {
    content: counter(step); position: absolute; left: 0; top: 9px;
    width: 26px; height: 26px; border-radius: 50%; background: var(--line);
    color: var(--muted); font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  ol#steps li.active { color: var(--text); }
  ol#steps li.active::before { background: var(--accent); color: #fff; animation: pulse 1.2s infinite; }
  ol#steps li.done { color: var(--ok); }
  ol#steps li.done::before { content: "✓"; background: transparent; color: var(--ok); border: 1px solid var(--ok); }
  ol#steps li.failed { color: var(--err); }
  ol#steps li.failed::before { content: "!"; background: transparent; color: var(--err); border: 1px solid var(--err); }
  @keyframes pulse { 50% { opacity: .5; } }

  ol#steps li .dur { float: right; color: var(--muted); font-size: 13px; margin-left: 10px; }
  ol#steps li .substep { margin-top: 4px; color: var(--muted); font-size: 13px; }
  ol#steps li .substep.current { color: var(--accent); }
  h2 { font-size: 17px; margin: 0 0 10px; }
  ul#joblist { list-style: none; margin: 0; padding: 0; }
  ul#joblist li {
    padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 14px;
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px;
  }
  ul#joblist li:last-child { border-bottom: none; }
  ul#joblist li:hover { background: #1a1f2b; }
  ul#joblist .muted { color: var(--muted); }

  #log {
    margin: 14px 0 0; padding: 12px; background: #10131a; border-radius: 8px;
    font: 12px/1.6 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap;
    max-height: 160px; overflow-y: auto;
  }
  .error { margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: rgba(255,93,93,.1); color: var(--err); white-space: pre-wrap; }
  .error.canceled { background: rgba(139,147,167,.12); color: var(--muted); }

  video { width: 100%; border-radius: 10px; background: #000; display: block; }
  .btn {
    display: inline-block; margin-top: 14px; padding: 10px 20px; border-radius: 9px;
    background: var(--accent); color: #fff; text-decoration: none; border: none;
    font-size: 15px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.secondary { background: var(--line); }
</style>
</head>
<body>
<main>
  <h1>Дубляж видео</h1>
  <p class="sub">Английский → русский, с клонированием голосов говорящих</p>

  <div id="drop" class="drop">
    <input type="file" id="file" accept="video/*" hidden>
    <p>Перетащите видео сюда<br>или <span class="link">выберите файл</span></p>
  </div>

  <section id="progress" hidden>
    <ol id="steps"></ol>
    <pre id="log" hidden></pre>
    <div id="error" class="error" hidden></div>
    <button id="cancel" class="btn secondary" hidden>Отменить</button>
    <button id="retry" class="btn" hidden>Повторить с места ошибки</button>
  </section>

  <section id="result" hidden>
    <video id="player" controls></video>
    <a id="download" class="btn" download>Скачать видео</a>
  </section>

  <button id="again" class="btn secondary" hidden>Дубляж ещё одного видео</button>

  <section id="jobs" hidden>
    <h2>Последние задачи</h2>
    <ul id="joblist"></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const drop = $("drop"), fileInput = $("file");
const LS_KEY = "unsloth_job_id";
let pollToken = 0; // чтобы клик по списку отменял опрос предыдущей задачи
let currentJobId = null; // для кнопки «Отменить»

function show(id, on) { $(id).hidden = !on; }

function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + " с";
  const m = Math.floor(sec / 60);
  if (m < 60) return m + " мин" + (sec % 60 ? " " + (sec % 60) + " с" : "");
  return Math.floor(m / 60) + " ч " + (m % 60) + " мин";
}

function renderSteps(job) {
  const ol = $("steps");
  ol.innerHTML = "";
  const now = Date.now() / 1000;
  const running = job.status === "processing" || job.status === "cancelling";
  for (let i = 0; i < job.steps.length; i++) {
    const s = job.steps[i];
    const li = document.createElement("li");
    // упавший шаг у задачи с ошибкой — красный, а не «активный»
    li.className = (s.state === "active" && job.status === "error") ? "failed" : s.state;
    const name = document.createElement("div");
    name.textContent = s.name;
    // время шага: зафиксированное для завершённых, живое (по started) — только пока задача идёт
    const dur = s.elapsed != null ? s.elapsed
              : (running && s.state === "active" && s.started ? now - s.started : null);
    if (dur != null) {
      const d = document.createElement("span");
      d.className = "dur";
      d.textContent = fmtDur(dur);
      name.appendChild(d);
    }
    li.appendChild(name);
    // активному шагу — одна живая строка «что сейчас происходит»; завершённым — ничего
    if (job.detail && i === job.step &&
        ["processing", "error", "canceled"].includes(job.status)) {
      const cur = document.createElement("div");
      cur.className = "substep current";
      cur.textContent = job.detail;
      li.appendChild(cur);
    }
    ol.appendChild(li);
  }
}

function applyJob(job) {
  show("drop", false);
  show("progress", true);
  renderSteps(job);
  if (job.log && job.log.length) { $("log").textContent = job.log.join("\n"); show("log", true); }

  if (job.status === "done") {
    $("player").src = job.video;
    $("download").href = job.video + "?download=true";
    show("result", true);
  }
  if (job.status === "error" || job.status === "canceled") {
    $("error").textContent = job.status === "canceled" ? "Задача отменена" : (job.error || "Неизвестная ошибка");
    $("error").classList.toggle("canceled", job.status === "canceled");
  }
  show("error", job.status === "error" || job.status === "canceled");
  const running = job.status === "processing" || job.status === "cancelling";
  if (running) {
    $("cancel").textContent = job.status === "cancelling" ? "Отменяю…" : "Отменить";
    $("cancel").disabled = job.status === "cancelling";
    show("cancel", true);
  } else show("cancel", false);
  const retryable = job.status === "error" || job.status === "canceled";
  if (retryable) $("retry").disabled = false;
  show("retry", retryable);
  show("again", !running);
}

async function poll(id) {
  currentJobId = id;
  const my = ++pollToken;
  let job;
  try {
    const r = await fetch("/api/jobs/" + id);
    if (!r.ok) throw new Error((await r.json()).detail || "HTTP " + r.status);
    job = await r.json();
  } catch (e) {
    $("error").textContent = "Сбой опроса статуса: " + e.message;
    show("error", true);
    return;
  }
  if (my !== pollToken) return; // уже смотрим другую задачу
  applyJob(job);
  refreshJobs();
  if (job.status === "processing" || job.status === "cancelling") setTimeout(() => poll(id), 2000);
}

async function start(file) {
  const fd = new FormData();
  fd.append("file", file);
  let id;
  try {
    const r = await fetch("/api/jobs", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || "HTTP " + r.status);
    id = (await r.json()).id;
  } catch (e) {
    alert("Не удалось загрузить видео: " + e.message);
    return;
  }
  localStorage.setItem(LS_KEY, id);
  show("result", false);
  show("error", false);
  show("log", false);
  show("cancel", false);
  $("retry").disabled = false;
  show("retry", false);
  poll(id);
}

function reset() {
  localStorage.removeItem(LS_KEY);
  currentJobId = null;
  show("drop", true);
  show("progress", false);
  show("result", false);
  show("again", false);
  $("cancel").disabled = false;
  $("retry").disabled = false;
  show("retry", false);
  $("player").removeAttribute("src");
  fileInput.value = "";
}

async function refreshJobs() {
  let data;
  try { data = await (await fetch("/api/jobs")).json(); } catch { return; }
  const ul = $("joblist");
  ul.innerHTML = "";
  if (!data.length) { show("jobs", false); return; }
  for (const j of data.slice(0, 8)) {
    const label = j.status === "processing" ? `Обработка · шаг ${j.step + 1}/7`
                : j.status === "cancelling" ? "Отмена…"
                : j.status === "done" ? "Готово"
                : j.status === "canceled" ? "Отменено" : "Ошибка";
    const li = document.createElement("li");
    const b = document.createElement("b"); b.textContent = j.id;
    const m = document.createElement("span"); m.className = "muted";
    m.textContent = `${label} · ${new Date(j.created * 1000).toLocaleString()}`;
    li.append(b, m);
    li.onclick = () => { localStorage.setItem(LS_KEY, j.id); poll(j.id); window.scrollTo({ top: 0 }); };
    ul.appendChild(li);
  }
  show("jobs", true);
}

// Восстановление прогресса после обновления страницы
(async function restore() {
  const id = localStorage.getItem(LS_KEY);
  if (!id) return;
  try {
    const r = await fetch("/api/jobs/" + id);
    if (!r.ok) throw new Error("задача не найдена");
    poll(id);
  } catch { localStorage.removeItem(LS_KEY); }
})();
refreshJobs();

drop.onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files[0]) start(fileInput.files[0]); };
$("again").onclick = reset;

$("cancel").onclick = async () => {
  if (!currentJobId) return;
  $("cancel").disabled = true; // статус «Отменяю…» подтянется следующим опросом
  try { await fetch("/api/jobs/" + currentJobId + "/cancel", { method: "POST" }); } catch {}
};

$("retry").onclick = async () => {
  if (!currentJobId) return;
  $("retry").disabled = true;
  let ok = false;
  try { ok = (await fetch("/api/jobs/" + currentJobId + "/retry", { method: "POST" })).ok; } catch {}
  if (ok) poll(currentJobId); // опрос после ошибки остановлен — возобновляем
  else $("retry").disabled = false;
};

["dragover", "dragleave", "drop"].forEach((ev) =>
  drop.addEventListener(ev, (e) => {
    e.preventDefault();
    drop.classList.toggle("over", ev === "dragover");
    if (ev === "drop" && e.dataTransfer.files[0]) start(e.dataTransfer.files[0]);
  })
);
</script>
</body>
</html>
